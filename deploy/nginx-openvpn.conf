[Unit]
Wants=openvpn.service dnsgrid.service
After=openvpn.service dnsgrid.service

[Service]
Restart=on-failure
RestartSec=10
TimeoutStartSec=120
# openvpn.service may finish before the tunnel address is available.
ExecStartPre=/usr/bin/timeout 90 /bin/sh -c 'until /usr/sbin/ip -4 -o address show dev tun0 2>/dev/null | /usr/bin/grep -Fq " inet 172.28.0.1/"; do /bin/sleep 1; done'
