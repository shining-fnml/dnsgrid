server {
    listen 172.28.0.1:8000 default_server;
    server_name 172.28.0.1;
    server_tokens off;

    # Do not log request URLs: the application exposes credential endpoints.
    access_log off;
    error_log /var/log/nginx/dnsgrid-error.log warn;
    client_max_body_size 10m;

    location /static/ {
        alias /var/www/dnsgrid/staticfiles/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://unix:/run/dnsgrid/gunicorn.sock;
        proxy_set_header Host $http_host;
        # Always replace caller-supplied headers; never append to them.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_redirect off;
        proxy_read_timeout 130s;
        proxy_cache off;
    }
}
